<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: #e5e7eb; font: 500 13px/1 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  .bar { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; background: #0f172a; color: #e2e8f0; flex: none; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: auto; }
  .group { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: rgba(255,255,255,0.08); }
  .group button { border: 0; border-radius: 6px; padding: 7px 12px; background: transparent; color: #cbd5e1; font: inherit; cursor: pointer; }
  .group button:hover { background: rgba(255,255,255,0.1); }
  .group button[aria-pressed="true"] { background: #fff; color: #0f172a; }
  .stage { flex: 1; min-height: 0; display: flex; justify-content: center; overflow: auto; }
  iframe { border: 0; background: #fff; }
  body[data-device="desktop"] iframe { width: 100%; height: 100%; }
  body[data-device="phone"] .stage { padding: 24px; }
  body[data-device="phone"] iframe { width: 390px; height: 844px; flex: none; border-radius: 28px; box-shadow: 0 0 0 10px #0f172a, 0 20px 50px rgba(15,23,42,0.35); }
</style>
</head>
<body data-device="desktop">
<div class="bar">
  <div class="title">__TITLE__</div>
  <div class="group" id="variants" data-design-variants></div>
  <div class="group" id="devices" data-design-devices>
    <button type="button" data-device="desktop" aria-pressed="true">Desktop</button>
    <button type="button" data-device="phone" aria-pressed="false">Phone</button>
  </div>
</div>
<div class="stage"><iframe id="screen" title="Design"></iframe></div>
<script>
const SCREEN = __SCREEN__;
const frame = document.getElementById('screen');
const variantBar = document.getElementById('variants');
let variants = [];
let current = 0;

frame.srcdoc = SCREEN;

function show(index) {
  if (!variants[index]) return;
  current = index;
  frame.contentWindow.postMessage({ type: 'design-lab:show', variant: variants[index] }, '*');
  for (const button of variantBar.children) {
    button.setAttribute('aria-pressed', String(Number(button.dataset.index) === index));
  }
  document.body.dataset.variant = variants[index];
}

function setDevice(device) {
  document.body.dataset.device = device;
  for (const button of document.querySelectorAll('[data-design-devices] button')) {
    button.setAttribute('aria-pressed', String(button.dataset.device === device));
  }
}

function onKey(key) {
  const index = Number(key) - 1;
  if (variants[index]) show(index);
  if (key === 'd') setDevice('desktop');
  if (key === 'p') setDevice('phone');
}

window.addEventListener('message', function onMessage(event) {
  if (event.source !== frame.contentWindow || !event.data) return;
  if (event.data.type === 'design-lab:ready') {
    variants = event.data.variants;
    variantBar.replaceChildren(...variants.map(function makeButton(label, index) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;
      button.dataset.index = String(index);
      button.title = index < 9 ? 'Key ' + (index + 1) : '';
      button.addEventListener('click', function onClick() { show(index); });
      return button;
    }));
    show(Math.min(current, variants.length - 1));
    document.body.dataset.ready = 'true';
  }
  if (event.data.type === 'design-lab:key') onKey(event.data.key);
});

document.querySelector('[data-design-devices]').addEventListener('click', function onDevice(event) {
  const device = event.target.closest('button')?.dataset.device;
  if (device) setDevice(device);
});

window.addEventListener('keydown', function onKeydown(event) { onKey(event.key); });
</script>
</body>
</html>
